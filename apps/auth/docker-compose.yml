services:
  postgres:
    # pgvector build of Postgres 17: the auth store lives in `rafiki_auth`, the API's
    # RAG index lives in `rafiki_rag`, and the vector extension is required by the latter.
    image: pgvector/pgvector:pg17
    container_name: rafiki-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rafiki
      POSTGRES_PASSWORD: rafiki
      POSTGRES_DB: rafiki_auth
    # Bind to loopback only: the auth server runs on this host, and this keeps the DB off
    # the tailnet / LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rafiki-auth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafiki -d rafiki_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher for development: the auth issuer sends verification codes here and you
  # read them at http://localhost:8025. Usable when the network blocks outbound SMTP (several
  # ISPs / managed networks do). MP_SMTP_AUTH_ACCEPT_ANY lets the issuer keep sending
  # SMTP_USER / SMTP_PASS over the loopback connection.
  mailpit:
    image: axllent/mailpit:latest
    container_name: rafiki-auth-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    # Loopback only, like Postgres: dev mail stays off the tailnet / LAN.
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI

volumes:
  rafiki-auth-postgres:
